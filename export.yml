# À placer dans .github/workflows/export.yml (dépôt privé apex).
# Calcule les forces des équipes et les publie dans le dépôt public apex-app,
# que l'application lit. Rien d'autre n'est publié : ni code privé, ni journal, ni clé.
# - Tout seul le mardi et le vendredi à 06h47, 30 minutes après « Données matchs ».
# - Ou à la main : Actions → Export appli → Run workflow.
name: Export appli

on:
  schedule:
    - cron: "47 6 * * 2,5"
  workflow_dispatch:

concurrency:
  group: export

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Calculer les forces des équipes
        run: python export.py
      - name: Publier dans apex-app
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -z "$APP_TOKEN" ]; then echo "Le secret APP_TOKEN est absent."; exit 1; fi
          git clone --depth 1 "https://harrismassila-bot:${APP_TOKEN}@github.com/harrismassila-bot/apex-app.git" app
          mkdir -p app/data
          cp export/*.json app/data/
          cd app
          git config user.name "apex-bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Données appli $(date -u +%F)"
          git push
